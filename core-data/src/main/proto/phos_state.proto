syntax = "proto3";

option java_package = "com.phos.core.data.proto";
option java_multiple_files = true;

message PhosState {
  int64 t_wake_epoch = 1;
  repeated Medication medications = 2;
  string last_ai_insight = 3;
  bool is_24_hour = 4;
  bool was_interrupted = 5;
  MealPreferences meal_preferences = 6;
  bool autonomic_strain_detected = 7;
  int64 safety_tightening_millis = 8;
}

message Medication {
  string id = 1;
  string name = 2;
  int64 scheduled_time = 3;
  string status = 4;
}

message MealPreferences {
  optional int64 breakfast_start_offset = 1;
  optional int64 breakfast_end_offset = 2;
  optional int64 lunch_start_offset = 3;
  optional int64 lunch_end_offset = 4;
  optional int64 dinner_start_offset = 5;
  optional int64 dinner_end_offset = 6;
}
