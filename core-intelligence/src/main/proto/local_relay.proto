syntax = "proto3";

package com.phos.core.intelligence.proto;

option java_package = "com.phos.core.intelligence.proto";
option java_multiple_files = true;

message RelayRequest {
  string device_id = 1;
  int64 timestamp = 2;
  repeated SymptomDelta symptoms = 3;
  repeated HealthDelta health_metrics = 4;
}

message SymptomDelta {
  string type = 1;
  int64 timestamp = 2;
  string value = 3;
  int32 severity = 4;
}

message HealthDelta {
  string metric_type = 1;
  int64 timestamp = 2;
  double value = 3;
}

message RelayResponse {
  string insight_summary = 1;
  repeated ScheduleAdjustment adjustments = 2;
}

message ScheduleAdjustment {
  string medication_id = 1;
  int64 suggested_time = 2;
  string rationale = 3;
}
